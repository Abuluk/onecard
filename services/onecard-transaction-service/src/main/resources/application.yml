server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: onecard-transaction-service
  profiles:
    default: dev
  cloud:
    circuitbreaker:
      resilience4j:
        enableSemaphoreDefaultBulkhead: true
    openfeign:
      circuitbreaker:
        enabled: true
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
management:
  tracing:
    propagation:
      type: W3C
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
