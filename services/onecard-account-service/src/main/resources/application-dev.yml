spring:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://onecard-oceanbase:2881/onecard_account}
    username: ${ACCOUNT_DB_USERNAME:onecard_account_app}
    password: ${ACCOUNT_DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  flyway:
    enabled: ${ACCOUNT_DB_ENABLED:false}
    url: ${ACCOUNT_DB_MIGRATION_URL:${ACCOUNT_DB_URL:jdbc:mysql://onecard-oceanbase:2881/onecard_account}}
    user: ${ACCOUNT_DB_MIGRATION_USERNAME:onecard_account_migrator}
    password: ${ACCOUNT_DB_MIGRATION_PASSWORD:}
    schemas: ${ACCOUNT_DB_SCHEMA:onecard_account}
    default-schema: ${ACCOUNT_DB_SCHEMA:onecard_account}
    locations: classpath:db/migration
    create-schemas: false
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://keycloak:8080/realms/onecard-dev/protocol/openid-connect/certs}
onecard:
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://keycloak:8080/realms/onecard-dev}
    audience: ${OIDC_AUDIENCE:onecard-account-service}
    required-scope: onecard.account.invoke
management:
  health:
    db:
      enabled: ${ACCOUNT_DB_ENABLED:false}
