x-spring-service: &spring-service
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${SERVER_PORT}/actuator/health | grep -q 'UP'"]
    interval: 10s
    timeout: 5s
    retries: 12
  restart: unless-stopped

services:
  nacos:
    image: docker.1panel.live/nacos/nacos-server:v3.1.1@sha256:13e74786507abbacebe080fae2fc9c05aa2591eb99c97a0a78ff0e72beb21b13
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-onecard-local}
      PREFER_HOST_MODE: ip
      TIME_ZONE: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: n9e
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  greptimedb:
    image: greptime/greptimedb:1.3.0
    command: ["standalone", "start", "--http-addr", "0.0.0.0:4000", "--data-home", "/greptimedb_data"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - greptimedb-data:/greptimedb_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  n9e:
    image: flashcatcloud/nightingale:9.0.0-beta.3-amd64
    command: ["/app/n9e", "-configs=/app/etc"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      greptimedb:
        condition: service_healthy
    ports:
      - "127.0.0.1:17000:17000"
    volumes:
      - ./n9e/config.toml:/app/etc/config.toml:ro
    restart: unless-stopped

  onecard-account-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-account-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8082"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"

  onecard-transaction-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-transaction-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8083"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"

  onecard-payment-adapter-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-payment-adapter-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8084"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"

  onecard-clearing-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-clearing-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8085"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"

  onecard-notification-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8086"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8086:8086"

  onecard-risk-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-risk-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8087"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8087"

  onecard-access-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-access-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8088"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"

  onecard-device-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-device-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8089"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:8089"

  onecard-gateway:
    <<: *spring-service
    build:
      context: ../../gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8081"
      MANAGEMENT_SERVER_PORT: "9081"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
      onecard-account-service:
        condition: service_healthy
      onecard-transaction-service:
        condition: service_healthy
      onecard-payment-adapter-service:
        condition: service_healthy
      onecard-clearing-service:
        condition: service_healthy
      onecard-notification-service:
        condition: service_healthy
      onecard-risk-service:
        condition: service_healthy
      onecard-access-service:
        condition: service_healthy
      onecard-device-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${MANAGEMENT_SERVER_PORT}/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

  categraf:
    image: flashcatcloud/categraf:v0.3.73-amd64
    environment:
      N9E_HOST: n9e:17000
    depends_on:
      n9e:
        condition: service_started
      onecard-account-service:
        condition: service_healthy
      onecard-transaction-service:
        condition: service_healthy
      onecard-payment-adapter-service:
        condition: service_healthy
      onecard-clearing-service:
        condition: service_healthy
      onecard-notification-service:
        condition: service_healthy
      onecard-risk-service:
        condition: service_healthy
      onecard-access-service:
        condition: service_healthy
      onecard-device-service:
        condition: service_healthy
      onecard-gateway:
        condition: service_healthy
    volumes:
      - ./categraf/input.prometheus.toml:/etc/categraf/conf/input.prometheus/prometheus.toml:ro
    restart: unless-stopped

volumes:
  nacos-data:
  mysql-data:
  greptimedb-data:
