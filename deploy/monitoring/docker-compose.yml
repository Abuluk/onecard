x-spring-service: &spring-service
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${SERVER_PORT}/actuator/health | grep -q 'UP'"]
    interval: 10s
    timeout: 5s
    retries: 12
  restart: unless-stopped

services:
  nacos:
    image: docker.1panel.live/nacos/nacos-server:v3.1.1@sha256:13e74786507abbacebe080fae2fc9c05aa2591eb99c97a0a78ff0e72beb21b13
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-onecard-local}
      PREFER_HOST_MODE: ip
      TIME_ZONE: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: n9e
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  valkey:
    image: docker.1panel.live/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  onecard-oceanbase:
    image: oceanbase/oceanbase-ce:4.4.2-lts@sha256:eaa2c3b3513fa21e4a658f197c1deb93c9d6b6eb742cfa5ef0f085f82b9cec54
    profiles: [business-data]
    entrypoint: ["bash", "-lc"]
    command: "sed -i 's/--min-cpu=/--max-cpu=2 --min-cpu=/' /root/boot/start.sh && /root/boot/start.sh"
    environment:
      MODE: MINI
      EXIT_WHILE_ERROR: "YES"
      OB_MEMORY_LIMIT: 6G
      OB_SYSTEM_MEMORY: 1G
      OB_DATAFILE_SIZE: 5G
      OB_LOG_DISK_SIZE: 5G
      OB_TENANT_NAME: onecard
      OB_TENANT_MIN_CPU: "1"
      OB_TENANT_MAX_CPU: "2"
      OB_TENANT_MEMORY_SIZE: 2G
      OB_TENANT_LOG_DISK_SIZE: 2G
    mem_limit: 10g
    cpus: 4
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      stack:
        soft: -1
        hard: -1
    volumes:
      - oceanbase-data:/root/ob
    healthcheck:
      test: ["CMD-SHELL", "obclient -h 127.0.0.1 -u root@sys -P 2881 --connect-timeout=3 -N -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  onecard-rocketmq-namesrv:
    image: apache/rocketmq:5.3.1@sha256:d2b231c1b9204129e4f4dd65ec1521c81b8d6826e5f1fe8daa521dab0db5bf16
    profiles: [business-messaging]
    command: ["sh", "mqnamesrv"]
    environment:
      MAX_POSSIBLE_HEAP: 512M
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  onecard-rocketmq-broker:
    image: apache/rocketmq:5.3.1@sha256:d2b231c1b9204129e4f4dd65ec1521c81b8d6826e5f1fe8daa521dab0db5bf16
    profiles: [business-messaging]
    command: ["sh", "mqbroker", "-n", "onecard-rocketmq-namesrv:9876"]
    environment:
      NAMESRV_ADDR: onecard-rocketmq-namesrv:9876
      MAX_POSSIBLE_HEAP: 768M
    depends_on:
      onecard-rocketmq-namesrv:
        condition: service_healthy
    mem_limit: 768m
    volumes:
      - rocketmq-data:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  greptimedb:
    image: greptime/greptimedb:1.3.0
    command: ["standalone", "start", "--http-addr", "0.0.0.0:4000", "--data-home", "/greptimedb_data"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - greptimedb-data:/greptimedb_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  n9e:
    image: flashcatcloud/nightingale:9.0.0-beta.3-amd64
    command: ["/app/n9e", "-configs=/app/etc"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      greptimedb:
        condition: service_healthy
    ports:
      - "127.0.0.1:17000:17000"
    volumes:
      - ./n9e/config.toml:/app/etc/config.toml:ro
    restart: unless-stopped

  onecard-account-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-account-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8082"
      NACOS_SERVER_ADDR: nacos:8848
      ONECARD_DEV_CONFIG_PROBE_ENABLED: ${ONECARD_DEV_CONFIG_PROBE_ENABLED:-false}
      ACCOUNT_DB_ENABLED: ${ACCOUNT_DB_ENABLED:-false}
      ACCOUNT_DB_URL: ${ACCOUNT_DB_URL:-jdbc:mysql://onecard-oceanbase:2881/onecard_account}
      ACCOUNT_DB_USERNAME: ${ACCOUNT_DB_USERNAME:-onecard_account_app@onecard}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-}
      ACCOUNT_DB_MIGRATION_URL: ${ACCOUNT_DB_MIGRATION_URL:-jdbc:mysql://onecard-oceanbase:2881/onecard_account}
      ACCOUNT_DB_MIGRATION_USERNAME: ${ACCOUNT_DB_MIGRATION_USERNAME:-onecard_account_migrator@onecard}
      ACCOUNT_DB_MIGRATION_PASSWORD: ${ACCOUNT_DB_MIGRATION_PASSWORD:-}
      ACCOUNT_DB_SCHEMA: ${ACCOUNT_DB_SCHEMA:-onecard_account}
    depends_on:
      nacos:
        condition: service_healthy

  onecard-transaction-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-transaction-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8083"
      NACOS_SERVER_ADDR: nacos:8848
      TRANSACTION_DB_ENABLED: ${TRANSACTION_DB_ENABLED:-false}
      TRANSACTION_DB_URL: ${TRANSACTION_DB_URL:-jdbc:mysql://onecard-oceanbase:2881/onecard_transaction}
      TRANSACTION_DB_USERNAME: ${TRANSACTION_DB_USERNAME:-onecard_transaction_app@onecard}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:-}
      TRANSACTION_DB_MIGRATION_URL: ${TRANSACTION_DB_MIGRATION_URL:-jdbc:mysql://onecard-oceanbase:2881/onecard_transaction}
      TRANSACTION_DB_MIGRATION_USERNAME: ${TRANSACTION_DB_MIGRATION_USERNAME:-onecard_transaction_migrator@onecard}
      TRANSACTION_DB_MIGRATION_PASSWORD: ${TRANSACTION_DB_MIGRATION_PASSWORD:-}
      TRANSACTION_DB_SCHEMA: ${TRANSACTION_DB_SCHEMA:-onecard_transaction}
    depends_on:
      nacos:
        condition: service_healthy

  onecard-payment-adapter-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-payment-adapter-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8084"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy

  onecard-clearing-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-clearing-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8085"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy

  onecard-notification-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8086"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy

  onecard-risk-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-risk-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8087"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy

  onecard-access-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-access-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8088"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy

  onecard-device-service:
    <<: *spring-service
    build:
      context: ../../services/onecard-device-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8089"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy

  onecard-gateway:
    <<: *spring-service
    build:
      context: ../../gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8081"
      MANAGEMENT_SERVER_PORT: "9081"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
      onecard-account-service:
        condition: service_healthy
      onecard-transaction-service:
        condition: service_healthy
      onecard-payment-adapter-service:
        condition: service_healthy
      onecard-clearing-service:
        condition: service_healthy
      onecard-notification-service:
        condition: service_healthy
      onecard-risk-service:
        condition: service_healthy
      onecard-access-service:
        condition: service_healthy
      onecard-device-service:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${MANAGEMENT_SERVER_PORT}/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

  categraf:
    image: flashcatcloud/categraf:v0.3.73-amd64
    environment:
      N9E_HOST: n9e:17000
    depends_on:
      n9e:
        condition: service_started
      onecard-account-service:
        condition: service_healthy
      onecard-transaction-service:
        condition: service_healthy
      onecard-payment-adapter-service:
        condition: service_healthy
      onecard-clearing-service:
        condition: service_healthy
      onecard-notification-service:
        condition: service_healthy
      onecard-risk-service:
        condition: service_healthy
      onecard-access-service:
        condition: service_healthy
      onecard-device-service:
        condition: service_healthy
      onecard-gateway:
        condition: service_healthy
    volumes:
      - ./categraf/input.prometheus.toml:/etc/categraf/conf/input.prometheus/prometheus.toml:ro
    restart: unless-stopped

volumes:
  nacos-data:
  mysql-data:
  greptimedb-data:
  oceanbase-data:
  rocketmq-data:
