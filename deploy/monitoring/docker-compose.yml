services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: n9e
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  greptimedb:
    image: greptime/greptimedb:1.3.0
    command: ["standalone", "start", "--http-addr", "0.0.0.0:4000", "--data-home", "/greptimedb_data"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - greptimedb-data:/greptimedb_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  n9e:
    image: flashcatcloud/nightingale:9.0.0-beta.3-amd64
    command: ["/app/n9e", "-configs=/app/etc"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      greptimedb:
        condition: service_healthy
    ports:
      - "127.0.0.1:17000:17000"
    volumes:
      - ./n9e/config.toml:/app/etc/config.toml:ro
    restart: unless-stopped

  onecard-demo-service:
    build:
      context: ../../onecard-demo-service
    environment:
      SPRING_PROFILES_ACTIVE: test
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  onecard-gateway:
    build:
      context: ../../onecard-gateway
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: demo-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://onecard-demo-service:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/api/demo/**
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  categraf:
    image: flashcatcloud/categraf:v0.3.73-amd64
    environment:
      N9E_HOST: n9e:17000
    depends_on:
      n9e:
        condition: service_started
      onecard-demo-service:
        condition: service_healthy
      onecard-gateway:
        condition: service_healthy
    volumes:
      - ./categraf/input.prometheus.toml:/etc/categraf/conf/input.prometheus/prometheus.toml:ro
    restart: unless-stopped

volumes:
  mysql-data:
  greptimedb-data:
