server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: onecard-gateway
  profiles:
    default: dev
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          routes:
            - id: account-service
              uri: lb://onecard-account-service
              predicates:
                - Path=/api/account/**
            - id: transaction-service
              uri: lb://onecard-transaction-service
              predicates:
                - Path=/api/transactions/**
            - id: payment-adapter-service
              uri: lb://onecard-payment-adapter-service
              predicates:
                - Path=/api/payments/**
            - id: clearing-service
              uri: lb://onecard-clearing-service
              predicates:
                - Path=/api/clearing/**
            - id: notification-service
              uri: lb://onecard-notification-service
              predicates:
                - Path=/api/notifications/**
management:
  tracing:
    propagation:
      type: W3C
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
