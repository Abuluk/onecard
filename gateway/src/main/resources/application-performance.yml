server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:19081}
spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: performance-stub
              uri: ${ONECARD_PERF_UPSTREAM_URL:http://127.0.0.1:19084}
              predicates:
                - Path=/api/account/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://127.0.0.1:19080/realms/onecard-dev/protocol/openid-connect/certs}
onecard:
  rate-limit:
    enabled: false
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://127.0.0.1:19080/realms/onecard-dev}
    audience: ${OIDC_AUDIENCE:onecard-api}
    roles:
      user: onecard-user
      admin: onecard-admin
      auditor: onecard-auditor
management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:19082}
  tracing:
    sampling:
      probability: 1.0
  health:
    redis:
      enabled: false
