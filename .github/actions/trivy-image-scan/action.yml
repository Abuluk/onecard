name: Scan Container Image
description: Fail when a built application image contains HIGH or CRITICAL vulnerabilities.
inputs:
  image-ref:
    description: Local Docker image reference to scan.
    required: true
runs:
  using: composite
  steps:
    - name: Scan image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        version: v0.76.2
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: false
        exit-code: "1"
