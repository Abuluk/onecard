# .github/workflows/ci.yml
name: CI — Build & Verify

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create ephemeral Nacos token
        run: |
          nacos_token="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$nacos_token"
          echo "NACOS_AUTH_TOKEN=$nacos_token" >> "$GITHUB_ENV"

      - name: Validate local Compose manifests
        run: |
          docker compose -f deploy/monitoring/docker-compose.yml config --quiet
          docker compose -f deploy/monitoring/docker-compose.yml -f deploy/monitoring/docker-compose.debug.yml config --quiet
          docker compose --profile business-data --profile business-messaging -f deploy/monitoring/docker-compose.yml config --quiet

      - name: Verify business service port boundaries
        shell: bash
        run: |
          base_config="$RUNNER_TEMP/onecard-base-compose.json"
          debug_config="$RUNNER_TEMP/onecard-debug-compose.json"
          docker compose --profile business-data --profile business-messaging \
            -f deploy/monitoring/docker-compose.yml config --format json > "$base_config"
          if jq -e '
            [.services | to_entries[]
              | select(.key | startswith("onecard-"))
              | select(.key != "onecard-gateway")
              | select((.value.ports // []) | length > 0)
            ] | length > 0
          ' "$base_config" >/dev/null; then
            echo "A business service publishes a host port in the default Compose profile." >&2
            exit 1
          fi
          if ! jq -e '
            (.services["onecard-gateway"].ports // []) as $ports
            | ($ports | length) == 1 and $ports[0].host_ip == "127.0.0.1"
              and (.networks["onecard-ingress"].internal // false) == false
              and (.services["onecard-gateway"].networks | has("onecard-ingress"))
              and ([.services | to_entries[]
                | select(.key != "onecard-gateway")
                | select((.value.networks // {}) | has("onecard-ingress"))] | length) == 0
          ' "$base_config" >/dev/null; then
            echo "The Gateway must bind only to 127.0.0.1 through the non-internal ingress network." >&2
            exit 1
          fi
          if ! jq -e '
            .networks["onecard-private"].internal == true
            and ([.services | to_entries[]
              | select(.key | startswith("onecard-"))
              | select(((.value.networks // {}) | has("onecard-private")) | not)] | length) == 0
          ' "$base_config" >/dev/null; then
            echo "Every onecard service must use the internal onecard-private network." >&2
            exit 1
          fi
          docker compose --profile business-data --profile business-messaging \
            -f deploy/monitoring/docker-compose.yml \
            -f deploy/monitoring/docker-compose.debug.yml config --format json > "$debug_config"
          if ! jq -e '
            [.services | to_entries[]
              | select(.key | startswith("onecard-"))
              | .value.ports[]?
            ] as $ports
            | ($ports | length) == 9
              and .networks["onecard-private"].internal == true
              and ([.services | to_entries[]
                | select(.key | startswith("onecard-"))
                | select(((.value.networks // {}) | has("onecard-private")) | not)] | length) == 0
              and ([ $ports[] | select(.host_ip != "127.0.0.1") ] | length) == 0
          ' "$debug_config" >/dev/null; then
            echo "Debug application ports must bind to 127.0.0.1 on the internal onecard-private network." >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: |
            pom.xml
            */pom.xml
            */*/pom.xml

      - name: Build & Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify production profiles fail closed without Nacos
        shell: bash
        run: |
          nacos_port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          for service in gateway account transaction access clearing device notification payment-adapter risk; do
            case "$service" in
              gateway) jar=gateway/target/onecard-gateway-1.0.0-SNAPSHOT.jar ;;
              account) jar=services/onecard-account-service/target/onecard-account-service-1.0.0-SNAPSHOT.jar ;;
              transaction) jar=services/onecard-transaction-service/target/onecard-transaction-service-1.0.0-SNAPSHOT.jar ;;
              access) jar=services/onecard-access-service/target/onecard-access-service-1.0.0-SNAPSHOT.jar ;;
              clearing) jar=services/onecard-clearing-service/target/onecard-clearing-service-1.0.0-SNAPSHOT.jar ;;
              device) jar=services/onecard-device-service/target/onecard-device-service-1.0.0-SNAPSHOT.jar ;;
              notification) jar=services/onecard-notification-service/target/onecard-notification-service-1.0.0-SNAPSHOT.jar ;;
              payment-adapter) jar=services/onecard-payment-adapter-service/target/onecard-payment-adapter-service-1.0.0-SNAPSHOT.jar ;;
              risk) jar=services/onecard-risk-service/target/onecard-risk-service-1.0.0-SNAPSHOT.jar ;;
            esac
            log="$RUNNER_TEMP/${service}-prod-nacos-failure.log"
            set +e
            timeout 60s java -jar "$jar" \
              --spring.profiles.active=prod \
              --spring.cloud.nacos.config.server-addr="127.0.0.1:$nacos_port" \
              --spring.cloud.nacos.discovery.server-addr="127.0.0.1:$nacos_port" \
              --server.port=0 --management.server.port=0 > "$log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || ! grep -qi nacos "$log"; then
              cat "$log"
              echo "$service production profile did not fail clearly when required Nacos configuration was unavailable." >&2
              exit 1
            fi
          done

      - name: Upload production profile failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-config-failure-logs
          path: ${{ runner.temp }}/*-prod-nacos-failure.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify enabled database fails closed when unavailable
        shell: bash
        run: |
          database_port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          for service in account transaction; do
            if [ "$service" = account ]; then
              jar=services/onecard-account-service/target/onecard-account-service-1.0.0-SNAPSHOT.jar
            else
              jar=services/onecard-transaction-service/target/onecard-transaction-service-1.0.0-SNAPSHOT.jar
            fi
            log="$RUNNER_TEMP/${service}-database-failure.log"
            jdbc_url="jdbc:mysql://127.0.0.1:$database_port/onecard_smoke"
            set +e
            timeout 60s java -jar "$jar" \
              --spring.profiles.active=dev \
              --spring.cloud.nacos.config.enabled=false \
              --spring.cloud.nacos.discovery.enabled=false \
              --spring.datasource.url="$jdbc_url" \
              --spring.datasource.username=phase1-smoke \
              --spring.datasource.password=phase1-smoke \
              --spring.flyway.enabled=true \
              --spring.flyway.url="$jdbc_url" \
              --spring.flyway.user=phase1-smoke \
              --spring.flyway.password=phase1-smoke \
              --server.port=0 --management.server.port=0 > "$log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || ! grep -Eqi 'flyway|connection refused|connect exception|hikari' "$log"; then
              cat "$log"
              echo "$service started or failed unclearly while its enabled database was unavailable." >&2
              exit 1
            fi
          done

      - name: Upload database failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: database-failure-logs
          path: ${{ runner.temp }}/*-database-failure.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Start isolated Keycloak for service identity integration test
        run: |
          client_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$client_secret"
          echo "ONECARD_KEYCLOAK_IT_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          jq --arg secret "$client_secret" \
            '(.clients[] | select(.clientId == "onecard-transaction-to-account")).secret = $secret' \
            tests/keycloak/onecard-dev-realm.json > "$RUNNER_TEMP/onecard-dev-realm.json"
          docker run --detach --name onecard-ci-keycloak \
            --publish 127.0.0.1:18080:8080 \
            --volume "$RUNNER_TEMP/onecard-dev-realm.json:/opt/keycloak/data/import/onecard-dev-realm.json:ro" \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            --env "KC_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 32)" \
            quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332 \
            start-dev --import-realm --hostname http://127.0.0.1:18080
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18080/realms/onecard-dev/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs onecard-ci-keycloak
          exit 1

      - name: Run real Keycloak service client credentials integration test
        env:
          ONECARD_KEYCLOAK_IT_ENABLED: "true"
          ONECARD_KEYCLOAK_IT_CLIENT_ID: onecard-transaction-to-account
          ONECARD_KEYCLOAK_IT_SCOPE: onecard.account.invoke
          ONECARD_KEYCLOAK_IT_TOKEN_URI: http://127.0.0.1:18080/realms/onecard-dev/protocol/openid-connect/token
          ONECARD_KEYCLOAK_IT_ISSUER: http://127.0.0.1:18080/realms/onecard-dev
          ONECARD_KEYCLOAK_IT_JWK_SET_URI: http://127.0.0.1:18080/realms/onecard-dev/protocol/openid-connect/certs
        run: ./mvnw --batch-mode --no-transfer-progress -pl services/onecard-transaction-service -am '-Dtest=ServiceClientCredentialsKeycloakIntegrationTest' '-Dsurefire.failIfNoSpecifiedTests=false' test

      - name: Capture Keycloak logs on failure
        if: failure()
        run: |
          if docker inspect onecard-ci-keycloak >/dev/null 2>&1; then
            docker logs onecard-ci-keycloak > "$RUNNER_TEMP/onecard-ci-keycloak.log" 2>&1
          fi

      - name: Upload Keycloak failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-integration-logs
          path: ${{ runner.temp }}/onecard-ci-keycloak.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove Keycloak integration service
        if: always()
        run: docker rm --force onecard-ci-keycloak 2>/dev/null || true

      - name: Run shared rate-limit integration tests
        env:
          VALKEY_IMAGE: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          ONECARD_VALKEY_IT_ENABLED: "true"
          ONECARD_VALKEY_IT_URL: redis://127.0.0.1:16379
        run: |
          docker run --detach --name onecard-ci-valkey --publish 127.0.0.1:16379:6379 "$VALKEY_IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec onecard-ci-valkey valkey-cli ping | grep -q PONG; then
              break
            fi
            sleep 1
          done
          docker exec onecard-ci-valkey valkey-cli ping | grep -q PONG
          ./mvnw --batch-mode --no-transfer-progress -pl gateway -Dtest=GatewayValkeyRateLimitIntegrationTest test

      - name: Remove shared rate-limit test service
        if: always()
        run: docker rm --force onecard-ci-valkey 2>/dev/null || true

      - name: Build application images
        id: build-images
        run: >-
          docker compose -p onecard-ci
          -f deploy/monitoring/docker-compose.yml
          build --pull onecard-gateway onecard-account-service onecard-transaction-service
          onecard-payment-adapter-service onecard-clearing-service
          onecard-notification-service onecard-risk-service onecard-access-service
          onecard-device-service

      - name: Start Nacos and account service
        run: >-
          docker compose -p onecard-ci
          -f deploy/monitoring/docker-compose.yml
          up --no-build --detach --wait --wait-timeout 180 onecard-account-service

      - name: Verify account registration in Nacos
        shell: bash
        run: |
          response="$(docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml exec -T nacos curl --fail --silent --show-error 'http://127.0.0.1:8848/nacos/v3/client/ns/instance/list?serviceName=onecard-account-service&groupName=DEFAULT_GROUP')"
          printf '%s' "$response" | python3 -c 'import json, sys; instances = json.load(sys.stdin)["data"]; assert any(item.get("healthy") is True and item.get("enabled") is True and item.get("port") == 8082 and item.get("metadata", {}).get("preserved.register.source") == "SPRING_CLOUD" for item in instances), instances'

      - name: Verify Nacos restart recovery
        shell: bash
        run: |
          docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml restart nacos
          docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml up --no-build --detach --wait --wait-timeout 180 nacos
          for attempt in $(seq 1 30); do
            response="$(docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml exec -T nacos curl --fail --silent 'http://127.0.0.1:8848/nacos/v3/client/ns/instance/list?serviceName=onecard-account-service&groupName=DEFAULT_GROUP' 2>/dev/null || true)"
            if printf '%s' "$response" | python3 -c 'import json, sys; instances = json.load(sys.stdin)["data"]; assert any(item.get("healthy") is True and item.get("enabled") is True and item.get("port") == 8082 and item.get("metadata", {}).get("preserved.register.source") == "SPRING_CLOUD" for item in instances)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "The account service did not re-register after Nacos restarted." >&2
          exit 1

      - name: Verify account service restart recovery
        shell: bash
        run: |
          docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml restart onecard-account-service
          docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml up --no-build --detach --wait --wait-timeout 180 onecard-account-service
          for attempt in $(seq 1 30); do
            response="$(docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml exec -T nacos curl --fail --silent 'http://127.0.0.1:8848/nacos/v3/client/ns/instance/list?serviceName=onecard-account-service&groupName=DEFAULT_GROUP' 2>/dev/null || true)"
            if printf '%s' "$response" | python3 -c 'import json, sys; instances = json.load(sys.stdin)["data"]; assert any(item.get("healthy") is True and item.get("enabled") is True and item.get("port") == 8082 for item in instances)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "The account service did not become healthy and re-register after its restart." >&2
          exit 1

      - name: Start and verify all nine applications
        shell: bash
        run: |
          docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml \
            up --no-build --detach --wait --wait-timeout 300 onecard-gateway
          services=(
            onecard-gateway:8081
            onecard-account-service:8082
            onecard-transaction-service:8083
            onecard-payment-adapter-service:8084
            onecard-clearing-service:8085
            onecard-notification-service:8086
            onecard-risk-service:8087
            onecard-access-service:8088
            onecard-device-service:8089
          )
          verify_registration() {
            local service="$1" port="$2" response
            response="$(docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml \
              exec -T nacos curl --fail --silent \
              "http://127.0.0.1:8848/nacos/v3/client/ns/instance/list?serviceName=${service}&groupName=DEFAULT_GROUP" 2>/dev/null || true)"
            printf '%s' "$response" | python3 -c 'import json, sys; service, port = sys.argv[1], int(sys.argv[2]); instances = json.load(sys.stdin)["data"]; assert any(item.get("healthy") is True and item.get("enabled") is True and item.get("port") == port for item in instances), (service, instances)' "$service" "$port" >/dev/null 2>&1
          }
          wait_registration() {
            local service="$1" port="$2"
            for attempt in $(seq 1 30); do
              if verify_registration "$service" "$port"; then return 0; fi
              sleep 2
            done
            echo "$service did not register as a healthy Nacos instance on port $port." >&2
            return 1
          }
          for service_port in "${services[@]}"; do
            IFS=: read -r service port <<< "$service_port"
            wait_registration "$service" "$port"
          done

      - name: Verify all applications recover after Nacos restart
        shell: bash
        run: |
          docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml restart nacos
          docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml \
            up --no-build --detach --wait --wait-timeout 180 nacos
          services=(
            onecard-gateway:8081
            onecard-account-service:8082
            onecard-transaction-service:8083
            onecard-payment-adapter-service:8084
            onecard-clearing-service:8085
            onecard-notification-service:8086
            onecard-risk-service:8087
            onecard-access-service:8088
            onecard-device-service:8089
          )
          for service_port in "${services[@]}"; do
            IFS=: read -r service port <<< "$service_port"
            recovered=false
            for attempt in $(seq 1 30); do
              response="$(docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml \
                exec -T nacos curl --fail --silent \
                "http://127.0.0.1:8848/nacos/v3/client/ns/instance/list?serviceName=${service}&groupName=DEFAULT_GROUP" 2>/dev/null || true)"
              if printf '%s' "$response" | python3 -c 'import json, sys; port = int(sys.argv[1]); instances = json.load(sys.stdin)["data"]; assert any(item.get("healthy") is True and item.get("enabled") is True and item.get("port") == port for item in instances), instances' "$port" >/dev/null 2>&1; then
                recovered=true
                break
              fi
              sleep 2
            done
            if [ "$recovered" != true ]; then
              echo "$service did not re-register after Nacos restarted." >&2
              exit 1
            fi
          done

      - name: Verify Gateway rejects anonymous protected requests
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 10 http://127.0.0.1:8081/api/account/balance)"
          test "$status" = 401

      - name: Capture platform startup logs on failure
        if: failure()
        run: docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml logs --no-color > "$RUNNER_TEMP/platform-compose.log" 2>&1 || true

      - name: Upload platform startup logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-startup-logs
          path: ${{ runner.temp }}/platform-compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop platform integration services
        if: always()
        run: docker compose -p onecard-ci -f deploy/monitoring/docker-compose.yml down --volumes --remove-orphans

      - name: Scan Gateway image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-gateway:latest

      - name: Scan account image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-account-service:latest

      - name: Scan transaction image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-transaction-service:latest

      - name: Scan payment adapter image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-payment-adapter-service:latest

      - name: Scan clearing image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-clearing-service:latest

      - name: Scan notification image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-notification-service:latest

      - name: Scan risk image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-risk-service:latest

      - name: Scan access image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-access-service:latest

      - name: Scan device image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: onecard-ci-onecard-device-service:latest

      - name: Scan Valkey image
        if: ${{ always() && steps.build-images.outcome == 'success' }}
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository changes for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  database-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: |
            pom.xml
            */pom.xml
            */*/pom.xml

      - name: Set OceanBase kernel prerequisites
        run: sudo sysctl -w fs.aio-max-nr=1048576 vm.max_map_count=655360

      - name: Run OceanBase migration and schema isolation smoke
        id: database-smoke
        shell: pwsh
        run: ./scripts/oceanbase-account-smoke.ps1 -CpuLimit 2 -CiProfile

      - name: Upload OceanBase migration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oceanbase-migration-smoke
          path: ${{ steps.database-smoke.outputs.report-directory }}
          if-no-files-found: ignore
          retention-days: 7
