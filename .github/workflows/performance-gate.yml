name: Performance Gate — k6

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '完整的目标测试 URL (例如 https://httpbin.org/get)'
        required: true
        type: string

jobs:
  k6-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: tests/performance/smoke.js
          flags: --env TARGET_URL=${{ inputs.target_url }}