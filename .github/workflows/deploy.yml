name: Publish OneCard Image

on:
  workflow_dispatch:
    inputs:
      module:
        description: Maven module to publish
        required: true
        type: choice
        options:
          - gateway
          - account
          - transaction
          - payment-adapter
          - clearing
          - notification
          - risk
          - access
          - device

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: |
            pom.xml
            */pom.xml
            */*/pom.xml

      - name: Resolve module path
        id: module
        env:
          MODULE: ${{ inputs.module }}
        run: |
          case "$MODULE" in
            gateway) path=gateway ;;
            account) path=services/onecard-account-service ;;
            transaction) path=services/onecard-transaction-service ;;
            payment-adapter) path=services/onecard-payment-adapter-service ;;
            clearing) path=services/onecard-clearing-service ;;
            notification) path=services/onecard-notification-service ;;
            risk) path=services/onecard-risk-service ;;
            access) path=services/onecard-access-service ;;
            device) path=services/onecard-device-service ;;
            *) echo "Unsupported module: $MODULE" >&2; exit 1 ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build and verify selected module
        env:
          MODULE_PATH: ${{ steps.module.outputs.path }}
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress -pl "$MODULE_PATH" -am clean verify

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.module.outputs.path }}
          file: ${{ steps.module.outputs.path }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/onecard-${{ inputs.module }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/onecard-${{ inputs.module }}:latest
