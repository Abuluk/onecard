name: CD — Build and Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

env:
  # 这里换成你的 Docker Hub 用户名和仓库名
  IMAGE_NAME: nytttt/nyt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: |
            pom.xml
            */pom.xml

      - name: Build with Maven (Full Verify)
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: nytttt
          password: dckr_pat_VAjjiE0HIi8f4U_utQtd4hmsJD4

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./onecard-demo-service
          file: ./onecard-demo-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}